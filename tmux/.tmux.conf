# Reload config with Prefix+r.
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Use Ctrl-Space as the prefix; keep the default Ctrl-b binding too.
set -g prefix C-Space
bind C-Space send-prefix

# General behavior.
set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g set-clipboard on

# Start new windows and panes in the current directory.
bind c new-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Vim-style pane movement with the prefix, plus convenient Ctrl-hjkl keys.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
#same as above but without prefix, for easier pane switching
#bind -n C-h select-pane -L
#bind -n C-j select-pane -D
#bind -n C-k select-pane -U
#bind -n C-l select-pane -R

# Resize panes with prefix + H/J/K/L (repeatable without re-pressing prefix).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching with prefix + number; cycle with prefix + Tab.
bind Tab next-window
bind BTab previous-window

# Vi-style copy mode. Enter starts a selection; y copies and exits.
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Keep panes and windows visually distinct with a compact status bar.
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-style 'bg=colour235,fg=colour252'
set -g status-left-style 'bg=colour24,fg=colour255,bold'
set -g status-right-style 'bg=colour235,fg=colour250'
set -g status-left '#[bold] #S '
set -g status-right '#[dim]%d-%m-%Y  %I:%M %p '
setw -g window-status-current-style 'bg=colour238,fg=colour81,bold'
setw -g window-status-style 'bg=colour235,fg=colour245'
setw -g window-status-current-format ' #[bold]#I:#W* '
setw -g window-status-format ' #I:#W '

# Use a single neutral divider with no active-pane border highlight.
set -g pane-border-status off
set -g pane-border-format ''
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=brightblack'
set -g pane-border-lines single
set -g window-style 'default'
set -g window-active-style 'default'

# Make the prefix+w window picker readable in dark terminals.
set -g mode-style 'bg=colour235,fg=colour255,bold'
set -g message-style 'bg=colour24,fg=colour255,bold'
set -g message-command-style 'bg=colour24,fg=colour255,bold'
set -g status-style 'bg=colour235,fg=colour255,bold'
